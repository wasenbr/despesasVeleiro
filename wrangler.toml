name = "despesas-veleiro"
main = "src/server/worker.ts"
compatibility_date = "2025-09-01"

# Interface (PWA) gerada por `npm run build`. O Worker só responde a /api/*.
[assets]
directory = "./dist/public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Banco de dados D1 (SQLite gratuito). Crie com `npx wrangler d1 create veleiro`
# e cole abaixo o database_id que o comando mostrar.
[[d1_databases]]
binding = "DB"
database_name = "veleiro"
database_id = "COLE-AQUI-O-ID-DO-BANCO"
migrations_dir = "migrations"

# Classificação automática por IA (opcional). A chave é segredo e NÃO vai neste arquivo:
#   npx wrangler secret put OPENROUTER_API_KEY
# O modelo pode ser trocado por qualquer id do OpenRouter (https://openrouter.ai/models).
[vars]
OPENROUTER_MODEL = "openai/gpt-4o-mini"
